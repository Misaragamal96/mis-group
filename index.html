<style>
/* Layout concept: a full-screen welcome stage whose ground color drifts as you scroll, then snap-scrolled slides and a quiet storefront. One bold moment: the logo and the big brand word rebuild themselves letter by letter. */
:root{
  --ink:#0b1220; --ink-2:#0f1a2e; --panel:#121d33; --panel-2:#17243d;
  --line:rgba(255,255,255,.1); --fg:#eaf0f7; --mute:#9db0c6;
  --gold:#f2c86b; --teal:#5ad1c8; --danger:#ff8a80;
  --display:"Space Grotesk","Cairo",system-ui,sans-serif;
  --body:"Inter","Cairo",system-ui,sans-serif;
  --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65}
html[lang="ar"] body{font-family:"Cairo",var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

/* logo */
.logo{display:inline-flex;align-items:center;gap:.5em;font-family:var(--display);font-weight:700;letter-spacing:.06em;direction:ltr;white-space:nowrap}
.logo .mark{width:1.5em;height:1.5em;flex:none;overflow:visible;object-fit:contain}
.logo svg.mark path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s cubic-bezier(.6,0,.2,1)}
.logo.in svg.mark path{stroke-dashoffset:0}
img.mark{opacity:0;transition:opacity 1s}
.logo.in img.mark{opacity:1}
.logo.reset svg.mark path,.logo.reset .ch,.logo.reset img.mark{transition:none!important}
.ch{display:inline-block;opacity:0;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0)) scale(.35);filter:blur(6px);transition:transform .95s cubic-bezier(.2,.9,.2,1),opacity .6s ease,filter .8s ease}
.ch.w2{font-weight:500;color:var(--teal)}
.logo.in .ch{opacity:1;transform:none;filter:none}
.logo .sp{display:inline-block;width:.35em}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#12304a 0%,#0b1220 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .8s ease,visibility .8s;cursor:pointer;padding:24px}
#splash.hide{opacity:0;visibility:hidden}
#splash .logo{font-size:clamp(34px,9vw,92px)}
#splash .tag{color:var(--mute);letter-spacing:.2em;font-size:13px;text-transform:uppercase;opacity:0;transition:opacity 1s ease 1.6s;text-align:center}
#splash.go .tag{opacity:1}
html[lang="ar"] #splash .tag{letter-spacing:.04em;font-size:16px;text-transform:none}
#splash .bar{width:min(240px,60vw);height:2px;background:var(--line);overflow:hidden;border-radius:2px}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width 4s linear}
#splash.go .bar i{width:100%}
#splash .skip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mute)}

/* nav */
#nav{position:fixed;inset-inline:0;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(11,18,32,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .5s cubic-bezier(.3,.8,.2,1),opacity .4s}
#nav.away{transform:translateY(-120%);opacity:0;pointer-events:none}
.nav-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.nav-logo{font-size:20px;text-decoration:none}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-inline-start:auto}
.links a,.links button{background:none;border:0;color:var(--mute);font:inherit;font-size:15px;font-weight:600;padding:8px 12px;border-radius:8px;text-decoration:none;cursor:pointer}
.links a:hover,.links button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.links a.on{color:var(--gold)}
.links .lang{border:1px solid var(--line);color:var(--fg)}

main{min-height:70vh}
main.pad{padding-top:calc(var(--nav-h) + 32px);padding-bottom:48px}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:600}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;background:var(--gold);color:#1a1405;font:inherit;font-weight:700;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:#06231f}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}

/* welcome stage */
#stage{height:200vh;height:200dvh;position:relative}
.snapA{position:absolute;left:0;width:1px;height:100vh;height:100dvh;scroll-snap-align:start;pointer-events:none}
.snapA.a1{top:0}.snapA.a2{top:100vh;top:100dvh}
html.snap{scroll-snap-type:y proximity}
@media (min-width:821px) and (min-height:620px){html.snap{scroll-snap-type:y mandatory}}
html.snap footer{scroll-snap-align:end}
.slide{min-height:100vh;min-height:100dvh;display:flex;align-items:center;scroll-snap-align:start;padding-block:calc(var(--nav-h) + 24px) 32px;position:relative}
.slide>.wrap{width:100%}
.slide.alt{background:linear-gradient(180deg,var(--ink),var(--ink-2))}
.sticky{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--ink)}
.sticky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 20%,rgba(242,200,107,.12),transparent 55%),radial-gradient(ellipse at 20% 90%,rgba(90,209,200,.14),transparent 55%);pointer-events:none}
#net{position:absolute;inset:0;width:100%;height:100%}
.hero-a,.hero-b{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:20px}
.hero-a .in,.hero-b .in{max-width:1100px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero-a h1{font-size:clamp(26px,4.6vw,52px);font-weight:600;display:flex;flex-direction:column;gap:4px}
.hero-a h1 .brand{color:var(--gold);white-space:nowrap;font-size:clamp(56px,16.5vw,200px);font-weight:700;line-height:.98;letter-spacing:-.02em;direction:ltr;text-align:start;display:block}
.hc{display:inline-block}
.hc.sp2{width:.28em}
.hero-a [data-r]{opacity:0;transform:translateY(46px);filter:blur(9px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.9,.2,1),filter .9s ease;transition-delay:var(--d,0ms)}
.hero-a.go [data-r]{opacity:1;transform:none;filter:none}
.hero-a .sub,.hero-b .sub{font-size:clamp(17px,2.2vw,22px);color:var(--mute);max-width:36em}
.cue{display:inline-flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.cue i{display:block;width:22px;height:36px;border:2px solid var(--mute);border-radius:12px;position:relative}
.cue i::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:7px;margin-left:-2px;border-radius:3px;background:var(--gold);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}80%{transform:translateY(12px);opacity:0}100%{opacity:0}}
.hero-b{opacity:0;pointer-events:none;align-items:center;text-align:center}
.hero-b .in{align-items:center}
.hero-b .logo{font-size:clamp(40px,12vw,150px)}
.hero-b h2{font-size:clamp(24px,4.2vw,44px);font-weight:600}

/* home blocks */
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.two h2,.slide h2{font-size:clamp(28px,4.4vw,46px);margin-block:10px 18px}
.lead{font-size:18px;color:var(--mute);max-width:40em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;counter-increment:s}
.step::before{content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1405;font-weight:700;font-family:var(--display)}
.step h3{font-size:19px}
.step p{color:var(--mute);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:130px}
.stat b{display:block;font-family:var(--display);font-size:32px;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:14px}
.head-row{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:24px}
.head-row h2{margin-block:0}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;transition:transform .25s,border-color .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-4px);border-color:rgba(242,200,107,.5);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.cover{aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--panel-2);display:block}
.cover svg,.cover img{width:100%;height:100%;display:block;object-fit:cover}
.card-b{display:flex;flex-direction:column;gap:6px;padding:16px;flex:1}
.cat{font-size:12px;color:var(--teal);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
html[lang="ar"] .cat{letter-spacing:0;font-size:13px}
.card h3{font-size:18px}
.clamp{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-family:var(--display);font-size:17px}
.price.free{color:var(--teal)}
.price.paid{color:var(--gold)}
.price.soon{color:var(--mute);font-weight:600;font-size:14px}
.plat{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

/* content page */
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;align-items:center}
.tools input[type=search]{flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:12px 16px;border-radius:10px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.empty{padding:48px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}

/* detail */
.crumb{display:inline-flex;gap:8px;color:var(--mute);text-decoration:none;font-size:15px;margin-bottom:20px}
.crumb:hover{color:var(--gold)}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.detail .cover{border-radius:16px;border:1px solid var(--line);aspect-ratio:4/3}
.detail h1{font-size:clamp(30px,4.6vw,48px);margin-block:8px 12px}
.buybox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-block:20px}
.buybox .price{font-size:28px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;font-size:15px;margin:0}
.meta dt{color:var(--mute)}
.meta dd{margin:0}
.feat{padding:0;margin:14px 0 0;list-style:none;display:flex;flex-direction:column;gap:8px}
.feat li{padding-inline-start:26px;position:relative}
.feat li::before{content:"";position:absolute;inset-inline-start:2px;top:.55em;width:10px;height:10px;border-radius:3px;background:var(--teal)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
.portrait{aspect-ratio:4/5;border-radius:18px;background:linear-gradient(160deg,#17304a,#241a4f 60%,#4a2318);border:1px solid var(--line);display:grid;place-items:center;position:sticky;top:calc(var(--nav-h) + 24px)}
.portrait .logo{font-size:clamp(22px,4vw,30px)}
.article h1{font-size:clamp(32px,5vw,54px);margin-block:8px 18px}
.article h2{font-size:26px;margin-block:36px 10px}
.article p{color:#cfd9e6;font-size:17px;margin-bottom:14px;max-width:42em}
.timeline{list-style:none;margin:16px 0 0;padding:0;border-inline-start:2px solid var(--line);display:flex;flex-direction:column;gap:18px}
.timeline li{padding-inline-start:20px;position:relative}
.timeline li::before{content:"";position:absolute;inset-inline-start:-7px;top:.5em;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.timeline b{display:block}
.timeline span{color:var(--mute);font-size:15px}
.social{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* admin */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.alist{display:flex;flex-direction:column;gap:10px;margin-block:18px}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.arow .t{flex:1 1 200px;min-width:0;font-weight:600}
.small{padding:7px 14px;font-size:14px}
.danger{color:var(--danger);border-color:rgba(255,138,128,.4)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;font-size:18px;margin-top:10px;color:var(--gold)}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.form label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--fg)}
.form input,.form textarea,.form select{background:var(--ink);border:1px solid var(--line);color:var(--fg);padding:10px 12px;border-radius:8px;font:inherit;min-width:0;width:100%}
.form input[type=checkbox]{width:auto}
.form textarea{min-height:96px;resize:vertical}
.form textarea.big{min-height:190px}
.form input[type=color]{padding:2px;height:42px}
.cols5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cols4{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.msg{margin-top:12px;font-size:15px;color:var(--teal)}
.msg.err{color:var(--danger)}
.hint{font-size:13px;color:var(--mute)}
.upl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pw{max-width:420px;margin:8vh auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.pw input{background:var(--ink);border:1px solid var(--line);color:var(--fg);padding:14px;border-radius:10px;font:inherit;font-size:20px;letter-spacing:.4em;text-align:center;width:100%;direction:ltr}

footer{border-top:1px solid var(--line);padding-block:32px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:center}
footer a{text-decoration:none;margin-inline-end:14px}
footer a:hover{color:var(--gold)}

@media (max-width:820px){
  .two,.detail,.about{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .cols5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .portrait{position:static;aspect-ratio:16/9}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ch{opacity:1;transform:none;filter:none;transition:none}
  .logo svg.mark path{stroke-dashoffset:0;transition:none}
  img.mark{opacity:1;transition:none}
  .hero-a [data-r]{opacity:1;transform:none;filter:none;transition:none}
  .cue i::after{animation:none}
  .card,.btn{transition:none}
}
</style>

function githubUpload(file){
  if(file.size>20*1024*1024)return Promise.reject(new Error("file-too-large"));

      var name=(file.name||"upload.bin").normalize("NFKD").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"")||"upload.bin";
      var path="uploads/"+Date.now()+"-"+name;
      return ghApi("PUT","contents/"+path.split("/").map(encodeURIComponent).join("/"),{message:"Upload site asset "+name,content:bytesToBase64(new Uint8Array(buffer)),branch:"main"}).then(function(result){return {url:result.content.download_url,sizeBytes:file.size}});

function initStage(){

function initNet(cv){
  if(!cv)return;
  var ctx=cv.getContext("2d"),w=0,h=0,nodes=[],raf=0,vis=true;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(80,w*h/15000));
    nodes=[];for(var i=0;i<n;i++)nodes.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4});
    draw(false);
  }
  function draw(step){
    ctx.clearRect(0,0,w,h);
    var i,j,a,b,d;
    for(i=0;i<nodes.length;i++){
      a=nodes[i];
      if(step){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1}
      for(j=i+1;j<nodes.length;j++){
        b=nodes[j];d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<150){ctx.strokeStyle="rgba(242,200,107,"+(0.22*(1-d/150)).toFixed(3)+")";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
      }
    }
    ctx.fillStyle="rgba(90,209,200,.7)";
    for(i=0;i<nodes.length;i++){ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,1.8,0,6.283);ctx.fill()}
  }
  function loop(){if(vis)draw(true);raf=requestAnimationFrame(loop)}
  size();
  if(!reduce)raf=requestAnimationFrame(loop);
  var io=null;
  if("IntersectionObserver" in window){io=new IntersectionObserver(function(es){vis=es[0].isIntersecting});io.observe(cv)}
  window.addEventListener("resize",size);
  cleanups.push(function(){cancelAnimationFrame(raf);if(io)io.disconnect();window.removeEventListener("resize",size)});
}
